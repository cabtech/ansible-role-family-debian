---
# --------------------------------

- name: 'Copy over Debian bash include'
  ansible.builtin.copy:
    src: debian.sh
    dest: /usr/local/etc/bash.d/
    owner: root
    group: root
    mode: '0644'
  when:
  - ansible_facts['os_family'] == 'Debian'
  become: true
  tags: ["debian"]

# --------------------------------

- name: 'Resolver fragments in {{ debian_resolver_fragdir }}'
  when:
  - ansible_facts['os_family'] == 'Debian'
  - ct_write_resolver | bool
  - ansible_facts['distribution'] != 'Kali'  # TODO
  - (ansible_facts['distribution'] != 'Ubuntu' or (ansible_facts['distribution_major_version'] | int < 18))
  become: true
  tags: ["debian"]
  block:
  - name: 'Make sure fragment directory exists: {{ debian_resolver_fragdir }}'
    ansible.builtin.file:
      path: '{{ debian_resolver_fragdir }}'
      state: directory
      mode: '0755'
      owner: root
      group: root
  - name: 'Copy resolv.head'
    ansible.builtin.template:
      src: resolv.head.j2
      dest: '{{ debian_resolver_fragdir }}/head'
      mode: '0644'
    notify: Handler_resolv
  - name: 'Copy resolv.tail'
    ansible.builtin.copy:
      src: resolv.tail
      dest: '{{ debian_resolver_fragdir }}/tail'
      mode: '0644'
    notify: Handler_resolv

# --------------------------------

- name: 'Handle various Debian packages'
  ansible.builtin.apt:
    pkg: '{{ item.value.pkgs }}'
    state: '{{ item.value.state }}'
  loop: '{{ debian_packages | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  when:
  - ansible_facts['os_family'] == 'Debian'
  become: true
  tags: ["debian"]

- name: 'Install developer packages'
  ansible.builtin.apt:
    pkg: ['exuberant-ctags', 'git']
    state: present
    update_cache: false
  when:
  - ansible_facts['os_family'] == 'Debian'
  become: true
  tags: ["debian"]

- name: 'Install system packages (~Tor,~DNS,~cloud)'
  ansible.builtin.apt:
    pkg: ['gparted', 'samba']
    state: present
  when:
  - ansible_facts['os_family'] == 'Debian'
  - ct_cloud is not defined
  - not (ct_dns_server | bool)
  - not (ct_tor | bool)
  - ct_provider is not defined
  become: true
  tags: ["debian"]

# --------------------------------

- name: 'Install NTP (TODO,do we need a handler?'  # TODO
  ansible.builtin.apt:
    pkg: ['ntp', 'ntpdate']
    state: present
  when:
  - ansible_facts['os_family'] == 'Debian'
  become: true
  tags: ["debian"]

- name: 'Make sure ssh daemon starts at boot'
  ansible.builtin.service:
    name: ssh
    enabled: true
  when:
  - ansible_facts['os_family'] == 'Debian'
  become: true
  tags: ["debian"]

# --------------------------------

- name: 'Install VMWare tools on Debian guests (~cloud)'
  ansible.builtin.apt:
    pkg: ['open-vm-tools', 'open-vm-tools-desktop']
    state: present
  become: true
  when:
  - ansible_facts['os_family'] == 'Debian'
  - ct_cloud is not defined
  - ansible_facts['virtualization_type'] | default('') | lower == 'vmware'
  - ct_vmware_tools_source == 'repo'
  tags: ["debian"]

# --------------------------------

- name: 'Deploy file for loading iptables on reboot (TODO)'  # TODO
  ansible.builtin.copy:
    src: iptablesload
    dest: /etc/network/if-pre-up.d
    owner: root
    mode: '0744'
  when:
  - ansible_facts['os_family'] == 'Debian'
  - false
  become: true
  tags: ["debian"]

# --------------------------------

- name: 'Weekly clean of APT cache'
  ansible.builtin.cron:
    name: 'ansible-weekly-apt-clean'
    state: present
    disabled: false
    user: 'root'
    weekday: '0'  # Sunday
    minute: '15'
    hour: '*/1'
    job: 'apt-get clean'
    cron_file: 'ansible-weekly-apt-clean'
  become: true
  when:
  - ansible_facts['os_family'] == 'Debian'
  - ct_container is not defined
  - ct_provider is not defined
  tags: ["debian"]

# --------------------------------
...
